<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Disposable Pro Cam</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Oswald:wght@500;700&display=swap');

        :root {
            /* Tema Default (Dispo Green) */
            --bg-color: #39FF14; 
            --text-color: #111;
            --accent-color: #E74C3C;
            --ui-panel: #1a1a1a;
            --btn-bg: #111;
            --btn-color: #39FF14;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body, html {
            width: 100%; height: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            transition: background-color 0.5s ease, color 0.5s ease;
        }

        /* --- TEMA DINAMIS --- */
        body.theme-kodak { --bg-color: #F1C40F; --btn-color: #F1C40F; }
        body.theme-fuji { --bg-color: #006D44; --text-color: #FFF; --btn-bg: #FFF; --btn-color: #006D44; }
        body.theme-ig { --bg-color: #E1306C; --text-color: #FFF; --btn-bg: #FFF; --btn-color: #E1306C; }
        body.theme-chrome { --bg-color: #D3D3D3; --text-color: #222; --btn-bg: #222; --btn-color: #FFF; }

        .app-container {
            display: flex; flex-direction: column; height: 100vh; height: 100dvh;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.15'/%3E%3C/svg%3E");
        }

        /* --- TOP BAR --- */
        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 20px; z-index: 10;
        }
        
        .icon-btn {
            background: var(--btn-bg); border: none; border-radius: 50%;
            width: 40px; height: 40px; display: flex; justify-content: center; align-items: center;
            cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .icon-btn svg { width: 20px; height: 20px; fill: var(--btn-color); }
        .icon-btn.active-state { background: var(--accent-color); }
        .icon-btn.active-state svg { fill: #FFF; }

        .brand-title {
            font-family: 'Oswald', sans-serif; font-size: 1.5rem; font-weight: 700;
            letter-spacing: 2px; text-transform: uppercase;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        /* --- VIEWFINDER --- */
        .viewfinder-wrapper {
            flex: 1; display: flex; justify-content: center; align-items: center;
            padding: 10px 20px;
        }
        .viewfinder {
            position: relative; width: 100%; max-width: 400px; aspect-ratio: 3/4;
            background: #000; border-radius: 20px; overflow: hidden;
            border: 12px solid #111;
            box-shadow: inset 0 0 20px rgba(0,0,0,1), 0 10px 25px rgba(0,0,0,0.6);
        }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        .viewfinder.frame-mode video {
            width: 85%; height: 80%; margin: 5% auto 0; display: block;
            border: 1px solid #ddd; background: #f4f4f4; object-fit: cover;
        }
        .viewfinder.frame-mode::before {
            content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: #f4f4f4; z-index: -1;
        }

        .live-date {
            position: absolute; bottom: 15px; right: 20px; font-family: 'Share Tech Mono', monospace;
            color: #ff5e00; font-size: 1.1rem; text-shadow: 1px 1px 4px rgba(255, 94, 0, 0.8); z-index: 2;
        }
        .viewfinder.frame-mode .live-date { bottom: 50px; right: 15%; }
        .screen-flash { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: white; opacity: 0; pointer-events: none; z-index: 10; }

        /* --- BOTTOM CONTROLS --- */
        .bottom-panel {
            background: var(--ui-panel); padding: 20px 20px 35px;
            display: flex; flex-direction: column; align-items: center; gap: 15px;
            border-top: 2px solid #333;
        }

        .film-selector-container {
            display: flex; align-items: center; background: var(--bg-color);
            border-radius: 30px; padding: 5px 15px; width: 280px;
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.4); border: 2px solid #000;
        }
        select {
            appearance: none; background: transparent; color: var(--text-color);
            border: none; font-family: 'Oswald', sans-serif; font-size: 15px;
            font-weight: bold; outline: none; flex: 1; text-transform: uppercase;
        }
        select option { background: #222; color: #fff; }

        .shutter-container { display: flex; justify-content: center; align-items: center; width: 100%; position: relative; }
        
        .shutter-btn {
            width: 75px; height: 75px; border-radius: 50%;
            background: radial-gradient(circle, #eee 40%, #ccc 100%);
            border: none; box-shadow: 0 6px 0 #888, 0 8px 15px rgba(0,0,0,0.5);
            cursor: pointer; transition: transform 0.1s;
        }
        .shutter-btn:active { transform: translateY(6px); box-shadow: 0 0 0 #888; }

        .gallery-btn {
            position: absolute; right: 0; width: 50px; height: 50px; border-radius: 6px;
            overflow: hidden; border: 2px solid #444; background: #111; cursor: pointer;
        }
        .gallery-btn img { width: 100%; height: 100%; object-fit: cover; }

        /* --- OVERLAYS --- */
        .full-overlay {
            position: fixed; top: 100%; left: 0; width: 100%; height: 100%;
            background: #121212; color: white; z-index: 100;
            transition: top 0.3s ease-in-out; display: flex; flex-direction: column;
        }
        .full-overlay.open { top: 0; }
        
        .overlay-header { 
            padding: 15px 20px; display: flex; justify-content: space-between; 
            align-items: center; background: #1a1a1a; border-bottom: 1px solid #333;
        }
        
        .text-btn { background: none; border: none; color: white; font-size: 16px; font-weight: bold; cursor: pointer; }
        
        .gallery-grid { padding: 5px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; overflow-y: auto; flex: 1; }
        .gallery-grid img { width: 100%; aspect-ratio: 3/4; object-fit: cover; cursor: pointer; border-radius: 2px; }

        .photo-viewer-content { flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px; background: #000; }
        .photo-viewer-content img { max-width: 100%; max-height: 100%; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .export-icon svg { width: 24px; height: 24px; fill: white; }

        canvas { display: none; }
    </style>
</head>
<body class="theme-default">

    <div class="app-container">
        <!-- Top Bar -->
        <div class="top-bar">
            <button class="icon-btn" id="flash-btn"><svg viewBox="0 0 24 24"><path d="M7 2v11h3v9l7-12h-4l4-8z"/></svg></button>
            <button class="icon-btn" id="frame-btn"><svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14z"/></svg></button>
            <span class="brand-title" id="brand-title">DISPO 35MM</span>
            <button class="icon-btn" id="flip-btn"><svg viewBox="0 0 24 24"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg></button>
        </div>

        <!-- Viewfinder -->
        <div class="viewfinder-wrapper">
            <div class="viewfinder" id="viewfinder">
                <video id="video" autoplay playsinline></video>
                <div class="live-date" id="live-date"></div>
                <div class="screen-flash" id="screen-flash"></div>
            </div>
        </div>

        <!-- Bottom Controls -->
        <div class="bottom-panel">
            <div class="film-selector-container">
                <select id="film-recipe">
                    <option value="dispo">DISPO GREEN</option>
                    <option value="kodak">KODAK GOLD 200</option>
                    <option value="fuji">SUPERIA 800</option>
                    <option value="golden-neg">GOLDEN NEGATIVE</option>
                    <option value="vintage-chrome">VINTAGE CHROME</option>
                    <option value="punchy-chrome">PUNCHY CHROME</option>
                </select>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="var(--text-color)"><path d="M7 10l5 5 5-5z"/></svg>
            </div>
            
            <div class="shutter-container">
                <button class="shutter-btn" id="snap"></button>
                <div class="gallery-btn" id="open-gallery-btn">
                    <img id="gallery-thumb" src="" alt="" style="display: none;">
                </div>
            </div>
        </div>
    </div>

    <!-- Gallery Overlay -->
    <div class="full-overlay" id="gallery-overlay">
        <div class="overlay-header">
            <button class="text-btn" id="close-gallery-btn">Cancel</button>
            <h2 style="font-family: 'Oswald', sans-serif; font-size: 18px;">LIBRARY</h2>
            <div style="width: 50px;"></div>
        </div>
        <div class="gallery-grid" id="gallery-grid"></div>
    </div>

    <!-- Single Photo Viewer -->
    <div class="full-overlay" id="photo-viewer-overlay">
        <div class="overlay-header">
            <button class="text-btn" id="close-viewer-btn">✖</button>
            <h2 style="font-family: 'Oswald', sans-serif; font-size: 16px; color: #aaa;">PREVIEW</h2>
            <a id="download-link" href="#" download="dispo-snap.jpg" class="text-btn export-icon">
                <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
            </a>
        </div>
        <div class="photo-viewer-content">
            <img id="viewed-photo" src="" alt="Viewed Snap">
        </div>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const snapBtn = document.getElementById('snap');
        const viewfinder = document.getElementById('viewfinder');
        const screenFlash = document.getElementById('screen-flash');
        const liveDate = document.getElementById('live-date');
        const brandTitle = document.getElementById('brand-title');
        
        // Buttons
        const flashBtn = document.getElementById('flash-btn');
        const frameBtn = document.getElementById('frame-btn');
        const flipBtn = document.getElementById('flip-btn');
        const recipeSelect = document.getElementById('film-recipe');
        
        // Gallery
        const galleryThumb = document.getElementById('gallery-thumb');
        const galleryGrid = document.getElementById('gallery-grid');
        const galleryOverlay = document.getElementById('gallery-overlay');
        const photoViewerOverlay = document.getElementById('photo-viewer-overlay');
        const viewedPhoto = document.getElementById('viewed-photo');
        const downloadLink = document.getElementById('download-link');
        
        let currentFacingMode = "environment";
        let isFlashOn = false;
        let isFrameOn = false;

        // Dynamic Theme Matcher
        recipeSelect.addEventListener('change', (e) => {
            const val = e.target.value;
            document.body.className = '';
            
            if(val === 'kodak') { document.body.classList.add('theme-kodak'); brandTitle.innerText = "KODAK GOLD"; }
            else if(val === 'fuji') { document.body.classList.add('theme-fuji'); brandTitle.innerText = "SUPERIA 800"; }
            else if(val === 'golden-neg') { document.body.classList.add('theme-chrome'); brandTitle.innerText = "GOLDEN NEG"; }
            else if(val === 'vintage-chrome') { document.body.classList.add('theme-chrome'); brandTitle.innerText = "VINTAGE CHROME"; }
            else if(val === 'punchy-chrome') { document.body.classList.add('theme-chrome'); brandTitle.innerText = "PUNCHY CHROME"; }
            else { document.body.classList.add('theme-default'); brandTitle.innerText = "DISPO 35MM"; }
        });

        function updateDate() {
            const d = new Date();
            liveDate.innerText = `'${String(d.getFullYear()).slice(2)} ${String(d.getMonth() + 1).padStart(2, '0')} ${String(d.getDate()).padStart(2, '0')}`;
        }
        updateDate();

        async function initCamera() {
            try {
                if (video.srcObject) video.srcObject.getTracks().forEach(track => track.stop());
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: currentFacingMode, width: { ideal: 1920 } } });
                video.srcObject = stream;
            } catch (err) { alert("Izinkan akses kamera di browser Anda."); }
        }
        initCamera();

        flashBtn.addEventListener('click', () => { isFlashOn = !isFlashOn; flashBtn.classList.toggle('active-state', isFlashOn); });
        frameBtn.addEventListener('click', () => { isFrameOn = !isFrameOn; frameBtn.classList.toggle('active-state', isFrameOn); viewfinder.classList.toggle('frame-mode', isFrameOn); });
        flipBtn.addEventListener('click', () => { currentFacingMode = currentFacingMode === "user" ? "environment" : "user"; initCamera(); video.style.transform = currentFacingMode === "user" ? "scaleX(-1)" : "scaleX(1)"; });

        document.getElementById('open-gallery-btn').addEventListener('click', () => galleryOverlay.classList.add('open'));
        document.getElementById('close-gallery-btn').addEventListener('click', () => galleryOverlay.classList.remove('open'));
        document.getElementById('close-viewer-btn').addEventListener('click', () => photoViewerOverlay.classList.remove('open'));

        function openSinglePhoto(srcUrl) {
            viewedPhoto.src = srcUrl;
            downloadLink.href = srcUrl;
            downloadLink.download = `snap_${new Date().getTime()}.jpg`;
            photoViewerOverlay.classList.add('open');
        }

        snapBtn.addEventListener('click', () => {
            screenFlash.style.transition = 'none'; screenFlash.style.opacity = '1';
            setTimeout(() => { screenFlash.style.transition = 'opacity 0.6s ease-out'; screenFlash.style.opacity = '0'; }, 50);

            const vw = Math.min(1920, video.videoWidth);
            const vh = vw / (video.videoWidth / video.videoHeight);
            const recipe = recipeSelect.value;
            const recipeText = brandTitle.innerText;

            let padX = 0, padYTop = 0, padYBot = 0;
            if (isFrameOn) {
                padX = vw * 0.05; padYTop = padX; padYBot = vw * 0.22; 
            }

            canvas.width = vw + (padX * 2);
            canvas.height = vh + padYTop + padYBot;

            if (isFrameOn) {
                ctx.fillStyle = '#f4f4f4'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#888'; ctx.font = `bold ${canvas.width * 0.035}px 'Oswald', sans-serif`;
                ctx.textAlign = 'center'; ctx.fillText(recipeText, canvas.width / 2, canvas.height - (padYBot / 2.5));
            }

            ctx.save(); ctx.beginPath(); ctx.rect(padX, padYTop, vw, vh); ctx.clip();

            if (currentFacingMode === "user") { ctx.translate(canvas.width, 0); ctx.scale(-1, 1); }

            // Apply Filters based on Recipes
            if (recipe === 'kodak') ctx.filter = 'contrast(1.1) saturate(1.3) sepia(0.2)';
            else if (recipe === 'fuji') ctx.filter = 'contrast(1.2) saturate(0.9) sepia(0.15) hue-rotate(10deg)';
            else if (recipe === 'golden-neg') ctx.filter = 'contrast(0.95) saturate(0.8) sepia(0.25) brightness(1.05)';
            else if (recipe === 'vintage-chrome') ctx.filter = 'contrast(1.2) saturate(1.1) sepia(0.3)';
            else if (recipe === 'punchy-chrome') ctx.filter = 'contrast(1.2) saturate(1.4) sepia(0.15)';
            else ctx.filter = 'contrast(1.1) saturate(1.1)';

            ctx.drawImage(video, padX, padYTop, vw, vh);
            ctx.restore(); ctx.save(); ctx.beginPath(); ctx.rect(padX, padYTop, vw, vh); ctx.clip(); 

            // Vignette
            const cx = padX + vw / 2; const cy = padYTop + vh / 2; const r = Math.max(vw, vh);
            const vignette = ctx.createRadialGradient(cx, cy, r * 0.2, cx, cy, r * 0.7);
            if (isFlashOn) {
                vignette.addColorStop(0, 'rgba(255,255,255,0.15)'); vignette.addColorStop(0.5, 'rgba(0,0,0,0)'); vignette.addColorStop(1, 'rgba(0,0,0,0.8)');
            } else {
                vignette.addColorStop(0, 'rgba(0,0,0,0)'); vignette.addColorStop(1, 'rgba(0,0,0,0.5)');
            }
            ctx.fillStyle = vignette; ctx.fillRect(padX, padYTop, vw, vh);

            // Color Overlays
            ctx.globalCompositeOperation = 'overlay';
            if (recipe === 'kodak') ctx.fillStyle = 'rgba(255, 180, 0, 0.15)';
            else if (recipe === 'fuji') ctx.fillStyle = 'rgba(0, 180, 120, 0.15)';
            else if (recipe === 'golden-neg') ctx.fillStyle = 'rgba(255, 200, 100, 0.12)';
            else if (recipe === 'vintage-chrome') ctx.fillStyle = 'rgba(255, 170, 80, 0.15)';
            else if (recipe === 'punchy-chrome') ctx.fillStyle = 'rgba(255, 160, 100, 0.12)';
            else ctx.fillStyle = 'rgba(57, 255, 20, 0.05)';
            
            ctx.fillRect(padX, padYTop, vw, vh);
            ctx.globalCompositeOperation = 'source-over';

            // Light Leaks (30% chance)
            if (Math.random() > 0.7) {
                const leak = ctx.createLinearGradient(padX, padYTop, padX + (vw * 0.3), padYTop);
                leak.addColorStop(0, 'rgba(255, 50, 0, 0.4)'); leak.addColorStop(1, 'rgba(255, 50, 0, 0)');
                ctx.fillStyle = leak; ctx.globalCompositeOperation = 'screen'; ctx.fillRect(padX, padYTop, vw, vh); ctx.globalCompositeOperation = 'source-over';
            }

            // Analog Grain Effect for Punchy Chrome
            if (recipe === 'punchy-chrome') {
                const imgData = ctx.getImageData(padX, padYTop, vw, vh);
                for(let i=0; i < imgData.data.length; i+=4) {
                    let noise = (Math.random() - 0.5) * 40;
                    imgData.data[i] = Math.min(255, Math.max(0, imgData.data[i] + noise));
                    imgData.data[i+1] = Math.min(255, Math.max(0, imgData.data[i+1] + noise));
                    imgData.data[i+2] = Math.min(255, Math.max(0, imgData.data[i+2] + noise));
                }
                ctx.putImageData(imgData, padX, padYTop);
            }

            // Date Stamp
            ctx.font = `bold ${vh * 0.04}px "Share Tech Mono", monospace`;
            ctx.fillStyle = '#ff7b00'; ctx.textAlign = 'right';
            ctx.shadowColor = '#ff5e00'; ctx.shadowBlur = 10; ctx.shadowOffsetX = 2; ctx.shadowOffsetY = 2;
            ctx.fillText(liveDate.innerText, padX + vw - (vw * 0.05), padYTop + vh - (vh * 0.05));
            ctx.shadowBlur = 0;
            ctx.restore(); 

            // Save and Add to UI Gallery
            const dataURL = canvas.toDataURL('image/jpeg', 0.9);
            galleryThumb.src = dataURL; galleryThumb.style.display = 'block';

            const imgEl = document.createElement('img');
            imgEl.src = dataURL;
            imgEl.addEventListener('click', () => openSinglePhoto(dataURL));
            galleryGrid.prepend(imgEl);
        });
    </script>
</body>
</html>
