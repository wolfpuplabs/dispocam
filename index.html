<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Disposable Pro Cam</title>
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Dispo Cam">
    <meta name="theme-color" content="#39FF14" id="theme-color-meta">
    
    <link rel="apple-touch-icon" href="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c5/Camera_icon.svg/512px-Camera_icon.svg.png">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Oswald:wght@500;700&display=swap');

        :root {
            --bg-color: #39FF14; --text-color: #111; --accent-color: #E74C3C;
            --ui-panel: #1a1a1a; --btn-bg: #111; --btn-color: #39FF14;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body, html {
            width: 100%; height: 100%; background-color: var(--bg-color); color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden; transition: background-color 0.5s ease, color 0.5s ease;
        }

        /* --- TEMA DINAMIS --- */
        body.theme-default { --bg-color: #39FF14; --btn-color: #39FF14; }
        body.theme-kodak { --bg-color: #F1C40F; --btn-color: #F1C40F; }
        body.theme-fuji { --bg-color: #006D44; --text-color: #FFF; --btn-bg: #FFF; --btn-color: #006D44; }
        body.theme-chrome { --bg-color: #D3D3D3; --text-color: #222; --btn-bg: #222; --btn-color: #FFF; }
        body.theme-bw { --bg-color: #111; --text-color: #FFF; --btn-bg: #333; --btn-color: #FFF; }
        body.theme-ig { --bg-color: #E1306C; --text-color: #FFF; --btn-bg: #FFF; --btn-color: #E1306C; }

        .app-container {
            display: flex; flex-direction: column; height: 100vh; height: 100dvh;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.15'/%3E%3C/svg%3E");
            padding-top: env(safe-area-inset-top);
        }

        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 15px 15px; z-index: 10; gap: 8px; }
        
        .icon-btn {
            background: var(--btn-bg); border: none; border-radius: 50%; flex-shrink: 0;
            width: 38px; height: 38px; display: flex; justify-content: center; align-items: center;
            cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .icon-btn svg { width: 18px; height: 18px; fill: var(--btn-color); }
        .icon-btn.active-state { background: var(--accent-color); }
        .icon-btn.active-state svg { fill: #FFF; }

        .brand-title {
            font-family: 'Oswald', sans-serif; font-size: 1.3rem; font-weight: 700;
            letter-spacing: 1px; text-transform: uppercase; text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
            text-align: center; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .viewfinder-wrapper { flex: 1; display: flex; justify-content: center; align-items: center; padding: 10px 20px; }
        .viewfinder {
            position: relative; width: 100%; max-width: 400px; aspect-ratio: 3/4; background: #000;
            border-radius: 20px; overflow: hidden; border: 12px solid #111;
            box-shadow: inset 0 0 20px rgba(0,0,0,1), 0 10px 25px rgba(0,0,0,0.6);
        }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        .viewfinder.frame-mode video { width: 85%; height: 80%; margin: 5% auto 0; display: block; background: #f4f4f4; object-fit: cover; }
        .viewfinder.frame-mode::before { content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: #f4f4f4; z-index: -1; }
        .viewfinder.rounded-mode video { border-radius: 24px; }

        .live-date { position: absolute; bottom: 15px; right: 20px; font-family: 'Share Tech Mono', monospace; color: #ff5e00; font-size: 1.1rem; text-shadow: 1px 1px 4px rgba(255, 94, 0, 0.8); z-index: 2; }
        .viewfinder.frame-mode .live-date { bottom: 50px; right: 15%; }
        .screen-flash { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: white; opacity: 0; pointer-events: none; z-index: 10; }

        .bottom-panel {
            background: var(--ui-panel); padding: 20px 20px 35px;
            display: flex; flex-direction: column; align-items: center; gap: 15px;
            border-top: 2px solid #333; padding-bottom: calc(35px + env(safe-area-inset-bottom));
        }

        .film-selector-container {
            display: flex; align-items: center; background: var(--bg-color);
            border-radius: 30px; padding: 5px 15px; width: 320px; /* Diperlebar sedikit */
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.4); border: 2px solid #000;
        }
        select { appearance: none; background: transparent; color: var(--text-color); border: none; font-family: 'Oswald', sans-serif; font-size: 15px; font-weight: bold; outline: none; flex: 1; text-transform: uppercase; }
        select optgroup { background: #111; color: var(--bg-color); }
        select option { background: #222; color: #fff; }

        .shutter-container { display: flex; justify-content: center; align-items: center; width: 100%; position: relative; }
        .shutter-btn {
            width: 75px; height: 75px; border-radius: 50%; background: radial-gradient(circle, #eee 40%, #ccc 100%);
            border: none; box-shadow: 0 6px 0 #888, 0 8px 15px rgba(0,0,0,0.5); cursor: pointer; transition: transform 0.1s;
        }
        .shutter-btn:active { transform: translateY(6px); box-shadow: 0 0 0 #888; }
        
        .gallery-btn { position: absolute; right: 0; width: 50px; height: 50px; border-radius: 6px; overflow: hidden; border: 2px solid #444; background: #111; cursor: pointer; }
        .gallery-btn img { width: 100%; height: 100%; object-fit: cover; }

        /* --- OVERLAYS --- */
        .full-overlay {
            position: fixed; top: 100%; left: 0; width: 100%; height: 100%; background: #121212; color: white; z-index: 100;
            transition: top 0.3s ease-in-out; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top);
        }
        .full-overlay.open { top: 0; }
        
        .overlay-header { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; background: #1a1a1a; border-bottom: 1px solid #333; }
        .text-btn { background: none; border: none; color: white; font-size: 16px; font-weight: bold; cursor: pointer; }
        .text-btn.highlight { color: #39FF14; }
        
        .gallery-grid { padding: 5px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; overflow-y: auto; flex: 1; align-content: flex-start;}
        
        .gallery-item { position: relative; cursor: pointer; }
        .gallery-item img { display: block; width: 100%; aspect-ratio: 3/4; object-fit: cover; border-radius: 4px; transition: 0.2s; }
        
        .gallery-item.selected::after {
            content: '✓'; position: absolute; bottom: 8px; right: 8px;
            background: #39FF14; color: black; font-weight: bold; font-family: sans-serif;
            width: 22px; height: 22px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            border: 2px solid black; box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
        .gallery-item.selected img { opacity: 0.6; border: 2px solid #39FF14; transform: scale(0.95); }

        .library-actions {
            display: none; justify-content: space-between; align-items: center;
            padding: 20px; background: #1a1a1a; border-top: 1px solid #333;
            padding-bottom: calc(20px + env(safe-area-inset-bottom));
        }
        .library-actions.show { display: flex; }
        .action-primary { background: #39FF14; color: black; border: none; padding: 12px 20px; border-radius: 20px; font-weight: bold; font-family: 'Oswald', sans-serif; font-size: 16px; cursor: pointer; display: flex; align-items: center; gap: 8px; flex: 1; justify-content: center; }
        .action-primary svg { width: 18px; height: 18px; fill: black; }

        .photo-viewer-content { flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px; background: #000; position: relative; }
        .photo-viewer-content img { max-width: 100%; max-height: 100%; box-shadow: 0 0 20px rgba(0,0,0,0.5); user-select: none; -webkit-touch-callout: default; }
        .action-icons { display: flex; gap: 15px; align-items: center; }
        .export-icon svg { width: 22px; height: 22px; fill: white; }

        canvas { display: none; }
    </style>
</head>
<body class="theme-default">

    <div class="app-container">
        <!-- Top Bar -->
        <div class="top-bar">
            <button class="icon-btn" id="flash-btn"><svg viewBox="0 0 24 24"><path d="M7 2v11h3v9l7-12h-4l4-8z"/></svg></button>
            <button class="icon-btn" id="frame-btn"><svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14z"/></svg></button>
            <button class="icon-btn" id="round-btn"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="6" ry="6" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
            
            <span class="brand-title" id="brand-title">DISPO 35MM</span>
            <button class="icon-btn" id="flip-btn"><svg viewBox="0 0 24 24"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg></button>
        </div>

        <div class="viewfinder-wrapper">
            <div class="viewfinder" id="viewfinder">
                <video id="video" autoplay playsinline></video>
                <div class="live-date" id="live-date"></div>
                <div class="screen-flash" id="screen-flash"></div>
            </div>
        </div>

        <!-- Bottom Controls -->
        <div class="bottom-panel">
            <div class="film-selector-container">
                <select id="film-recipe">
                    <optgroup label="Dispo Cameras">
                        <option value="dispo">DISPO GREEN</option>
                        <option value="kodak-gold">KODAK GOLD 200</option>
                        <option value="superia">SUPERIA 800</option>
                    </optgroup>
                    <optgroup label="Fuji X Weekly">
                        <option value="classic-neg">CLASSIC NEGATIVE</option>
                        <option value="kodachrome64">KODACHROME 64</option>
                        <option value="portra400">KODAK PORTRA 400</option>
                        <option value="trix400">KODAK TRI-X 400 (B&W)</option>
                        <option value="cinestill800t">CINESTILL 800T</option>
                        <option value="industrial100">FUJICOLOR INDUSTRIAL</option>
                        <option value="velvia">FUJI VELVIA</option>
                        <option value="punchy-chrome">PUNCHY CHROME</option>
                    </optgroup>
                    <optgroup label="Instagram Filters">
                        <option value="ig-90s">90s DREAMS</option>
                        <option value="ig-flash">IG FLASH</option>
                        <option value="ig-filmgrade">FILM GRADE</option>
                        <option value="ig-cinematic">CINEMATIC</option>
                    </optgroup>
                </select>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="var(--text-color)"><path d="M7 10l5 5 5-5z"/></svg>
            </div>
            
            <div class="shutter-container">
                <button class="shutter-btn" id="snap"></button>
                <div class="gallery-btn" id="open-gallery-btn">
                    <img id="gallery-thumb" src="" alt="" style="display: none;">
                </div>
            </div>
        </div>
    </div>

    <!-- Gallery / Library Overlay -->
    <div class="full-overlay" id="gallery-overlay">
        <div class="overlay-header">
            <button class="text-btn" id="close-gallery-btn">Cancel</button>
            <h2 style="font-family: 'Oswald', sans-serif; font-size: 18px;">LIBRARY</h2>
            <button class="text-btn highlight" id="select-mode-btn">Select</button>
        </div>
        <div class="gallery-grid" id="gallery-grid"></div>
        
        <div class="library-actions" id="library-actions">
            <button class="action-primary" id="multi-share-btn">
                <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                Save/Share (<span id="select-count">0</span>)
            </button>
        </div>
    </div>

    <!-- Single Photo Viewer Overlay -->
    <div class="full-overlay" id="photo-viewer-overlay">
        <div class="overlay-header">
            <button class="text-btn" id="close-viewer-btn">Back</button>
            <h2 style="font-family: 'Oswald', sans-serif; font-size: 16px; color: #aaa;">PREVIEW</h2>
            
            <div class="action-icons">
                <button class="text-btn export-icon" id="single-share-btn">
                    <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"/></svg>
                </button>
            </div>
        </div>
        <div class="photo-viewer-content">
            <img id="viewed-photo" src="" alt="Viewed Snap">
        </div>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const snapBtn = document.getElementById('snap');
        const viewfinder = document.getElementById('viewfinder');
        const screenFlash = document.getElementById('screen-flash');
        const liveDate = document.getElementById('live-date');
        const brandTitle = document.getElementById('brand-title');
        const themeMeta = document.getElementById('theme-color-meta');
        
        const flashBtn = document.getElementById('flash-btn');
        const frameBtn = document.getElementById('frame-btn');
        const roundBtn = document.getElementById('round-btn');
        const flipBtn = document.getElementById('flip-btn');
        const recipeSelect = document.getElementById('film-recipe');
        const singleShareBtn = document.getElementById('single-share-btn');
        
        const galleryThumb = document.getElementById('gallery-thumb');
        const galleryGrid = document.getElementById('gallery-grid');
        const galleryOverlay = document.getElementById('gallery-overlay');
        const photoViewerOverlay = document.getElementById('photo-viewer-overlay');
        const viewedPhoto = document.getElementById('viewed-photo');
        
        const selectModeBtn = document.getElementById('select-mode-btn');
        const libraryActions = document.getElementById('library-actions');
        const selectCountText = document.getElementById('select-count');
        const multiShareBtn = document.getElementById('multi-share-btn');
        
        let currentFacingMode = "environment";
        let isFlashOn = false;
        let isFrameOn = false;
        let isRoundOn = false;
        let currentPhotoDataUrl = "";
        
        let isSelectMode = false;
        let selectedPhotos = new Set();

        roundBtn.addEventListener('click', () => { 
            isRoundOn = !isRoundOn; 
            roundBtn.classList.toggle('active-state', isRoundOn);
            viewfinder.classList.toggle('rounded-mode', isRoundOn);
        });

        recipeSelect.addEventListener('change', (e) => {
            const val = e.target.value;
            document.body.className = '';
            
            if(['kodak-gold', 'portra400'].includes(val)) { document.body.classList.add('theme-kodak'); themeMeta.content = "#F1C40F"; brandTitle.innerText = val === 'portra400' ? "PORTRA 400" : "KODAK GOLD"; }
            else if(['superia', 'velvia', 'industrial100'].includes(val)) { document.body.classList.add('theme-fuji'); themeMeta.content = "#006D44"; brandTitle.innerText = val === 'velvia' ? "VELVIA VIVID" : (val === 'industrial100' ? "FUJI INDUSTRIAL" : "SUPERIA 800"); }
            else if(['classic-neg', 'kodachrome64', 'punchy-chrome', 'cinestill800t'].includes(val)) { document.body.classList.add('theme-chrome'); themeMeta.content = "#D3D3D3"; brandTitle.innerText = val.replace('-', ' ').toUpperCase(); }
            else if(['trix400'].includes(val)) { document.body.classList.add('theme-bw'); themeMeta.content = "#111111"; brandTitle.innerText = "KODAK TRI-X"; }
            else if(val.startsWith('ig-')) { document.body.classList.add('theme-ig'); themeMeta.content = "#E1306C"; brandTitle.innerText = val.replace('ig-', '').toUpperCase(); }
            else { document.body.classList.add('theme-default'); themeMeta.content = "#39FF14"; brandTitle.innerText = "DISPO 35MM"; }
        });

        function updateDate() {
            const d = new Date();
            liveDate.innerText = `'${String(d.getFullYear()).slice(2)} ${String(d.getMonth() + 1).padStart(2, '0')} ${String(d.getDate()).padStart(2, '0')}`;
        }
        updateDate();

        async function initCamera() {
            try {
                if (video.srcObject) video.srcObject.getTracks().forEach(track => track.stop());
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: currentFacingMode, width: { ideal: 1920 } } });
                video.srcObject = stream;
            } catch (err) { alert("Izinkan akses kamera di browser Anda."); }
        }
        initCamera();

        flashBtn.addEventListener('click', () => { isFlashOn = !isFlashOn; flashBtn.classList.toggle('active-state', isFlashOn); });
        frameBtn.addEventListener('click', () => { isFrameOn = !isFrameOn; frameBtn.classList.toggle('active-state', isFrameOn); viewfinder.classList.toggle('frame-mode', isFrameOn); });
        flipBtn.addEventListener('click', () => { currentFacingMode = currentFacingMode === "user" ? "environment" : "user"; initCamera(); video.style.transform = currentFacingMode === "user" ? "scaleX(-1)" : "scaleX(1)"; });

        document.getElementById('open-gallery-btn').addEventListener('click', () => galleryOverlay.classList.add('open'));
        document.getElementById('close-gallery-btn').addEventListener('click', () => {
            galleryOverlay.classList.remove('open');
            resetSelectionMode();
        });
        document.getElementById('close-viewer-btn').addEventListener('click', () => photoViewerOverlay.classList.remove('open'));

        // Multi Select Logic
        function resetSelectionMode() {
            isSelectMode = false; selectModeBtn.innerText = "Select"; selectedPhotos.clear();
            updateMultiUI(); document.querySelectorAll('.gallery-item').forEach(el => el.classList.remove('selected'));
        }

        selectModeBtn.addEventListener('click', () => {
            isSelectMode = !isSelectMode;
            selectModeBtn.innerText = isSelectMode ? "Cancel Select" : "Select";
            if(!isSelectMode) resetSelectionMode();
            updateMultiUI();
        });

        function updateMultiUI() {
            selectCountText.innerText = selectedPhotos.size;
            libraryActions.classList.toggle('show', isSelectMode && selectedPhotos.size > 0);
        }

        function handleGalleryItemClick(e, url, itemDiv) {
            if (isSelectMode) {
                if (selectedPhotos.has(url)) { selectedPhotos.delete(url); itemDiv.classList.remove('selected'); } 
                else { selectedPhotos.add(url); itemDiv.classList.add('selected'); }
                updateMultiUI();
            } else {
                currentPhotoDataUrl = url; viewedPhoto.src = url;
                photoViewerOverlay.classList.add('open');
            }
        }

        async function dataUrlToFile(dataUrl, filename) {
            const res = await fetch(dataUrl);
            const blob = await res.blob();
            return new File([blob], filename, { type: 'image/jpeg' });
        }

        singleShareBtn.addEventListener('click', async () => {
            if (!navigator.share) { alert("Tahan gambar lalu pilih Save Image"); return; }
            try {
                const file = await dataUrlToFile(currentPhotoDataUrl, `dispo_${Date.now()}.jpg`);
                await navigator.share({ files: [file] });
            } catch (err) {}
        });

        multiShareBtn.addEventListener('click', async () => {
            if (selectedPhotos.size === 0) return;
            if (!navigator.share) {
                alert("Browser tidak mendukung multi-share. Foto diunduh bertahap.");
                let delay = 0;
                selectedPhotos.forEach(url => {
                    setTimeout(() => { const a = document.createElement('a'); a.href = url; a.download = `dispo_${Date.now()}.jpg`; a.click(); }, delay);
                    delay += 300;
                });
                resetSelectionMode(); return;
            }
            try {
                const filePromises = Array.from(selectedPhotos).map((url, i) => dataUrlToFile(url, `dispo_${Date.now()}_${i}.jpg`));
                const files = await Promise.all(filePromises);
                if (navigator.canShare && navigator.canShare({ files })) {
                    await navigator.share({ files: files }); resetSelectionMode();
                } else alert("Tidak dapat membagikan banyak file.");
            } catch (err) {}
        });

        function roundRect(ctx, x, y, width, height, radius) {
            ctx.beginPath(); ctx.moveTo(x + radius, y); ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius); ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height); ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius); ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y); ctx.closePath();
        }

        // ================== SNAP & RENDER ==================
        snapBtn.addEventListener('click', () => {
            screenFlash.style.transition = 'none'; screenFlash.style.opacity = '1';
            setTimeout(() => { screenFlash.style.transition = 'opacity 0.6s ease-out'; screenFlash.style.opacity = '0'; }, 50);

            const vw = Math.min(1920, video.videoWidth);
            const vh = vw / (video.videoWidth / video.videoHeight);
            const recipe = recipeSelect.value;
            const recipeText = brandTitle.innerText;

            let padX = 0, padYTop = 0, padYBot = 0;
            if (isFrameOn) { padX = vw * 0.05; padYTop = padX; padYBot = vw * 0.22; }
            const cornerRadius = isRoundOn ? (vw * 0.05) : 0; 

            canvas.width = vw + (padX * 2); canvas.height = vh + padYTop + padYBot;

            if (isFrameOn) {
                ctx.fillStyle = '#f4f4f4';
                if (isRoundOn) { roundRect(ctx, 0, 0, canvas.width, canvas.height, cornerRadius * 1.5); ctx.fill(); } 
                else ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = '#888'; ctx.font = `bold ${canvas.width * 0.035}px 'Oswald', sans-serif`;
                ctx.textAlign = 'center'; ctx.fillText(recipeText, canvas.width / 2, canvas.height - (padYBot / 2.5));
            }

            ctx.save(); 
            if (isRoundOn) roundRect(ctx, padX, padYTop, vw, vh, cornerRadius);
            else { ctx.beginPath(); ctx.rect(padX, padYTop, vw, vh); }
            ctx.clip(); 

            if (currentFacingMode === "user") { ctx.translate(canvas.width, 0); ctx.scale(-1, 1); }

            // Filter Base Baru
            if (recipe === 'kodak-gold') ctx.filter = 'contrast(1.1) saturate(1.3) sepia(0.2)';
            else if (recipe === 'superia') ctx.filter = 'contrast(1.2) saturate(0.9) sepia(0.15) hue-rotate(10deg)';
            else if (recipe === 'portra400') ctx.filter = 'contrast(0.9) saturate(1.1) sepia(0.15) brightness(1.05)';
            else if (recipe === 'velvia') ctx.filter = 'contrast(1.3) saturate(1.5) brightness(1.05)';
            else if (recipe === 'classic-neg') ctx.filter = 'contrast(1.3) saturate(0.85) sepia(0.1) hue-rotate(5deg)';
            else if (recipe === 'kodachrome64') ctx.filter = 'contrast(1.25) saturate(1.2) sepia(0.1)';
            else if (recipe === 'trix400') ctx.filter = 'grayscale(100%) contrast(1.4) brightness(0.95)';
            else if (recipe === 'cinestill800t') ctx.filter = 'contrast(1.25) saturate(1.1) hue-rotate(-10deg) brightness(0.95)';
            else if (recipe === 'industrial100') ctx.filter = 'contrast(1.15) saturate(1.2) hue-rotate(-5deg)';
            else if (recipe === 'punchy-chrome') ctx.filter = 'contrast(1.2) saturate(1.4) sepia(0.15)';
            
            // IG Filters
            else if (recipe === 'ig-90s') ctx.filter = 'contrast(0.9) brightness(1.1) saturate(1.3) sepia(0.1)';
            else if (recipe === 'ig-flash') ctx.filter = 'contrast(1.4) brightness(1.15) saturate(1.1)';
            else if (recipe === 'ig-filmgrade') ctx.filter = 'contrast(1.2) saturate(0.8) sepia(0.1)';
            else if (recipe === 'ig-cinematic') ctx.filter = 'contrast(1.3) saturate(0.9) sepia(0.2) hue-rotate(-10deg)';
            else ctx.filter = 'contrast(1.1) saturate(1.1)';

            ctx.drawImage(video, padX, padYTop, vw, vh);
            ctx.restore(); 
            
            ctx.save(); 
            if (isRoundOn) roundRect(ctx, padX, padYTop, vw, vh, cornerRadius);
            else { ctx.beginPath(); ctx.rect(padX, padYTop, vw, vh); }
            ctx.clip(); 

            // Vignette (Flash override)
            const cx = padX + vw / 2; const cy = padYTop + vh / 2; const r = Math.max(vw, vh);
            const vignette = ctx.createRadialGradient(cx, cy, r * 0.2, cx, cy, r * 0.7);
            if (isFlashOn || recipe === 'ig-flash') {
                vignette.addColorStop(0, 'rgba(255,255,255,0.15)'); vignette.addColorStop(0.5, 'rgba(0,0,0,0)'); vignette.addColorStop(1, 'rgba(0,0,0,0.85)');
            } else {
                vignette.addColorStop(0, 'rgba(0,0,0,0)'); vignette.addColorStop(1, 'rgba(0,0,0,0.5)');
            }
            ctx.fillStyle = vignette; ctx.fillRect(padX, padYTop, vw, vh);

            // Color Overlays
            ctx.globalCompositeOperation = 'overlay';
            if (recipe === 'kodak-gold') ctx.fillStyle = 'rgba(255, 180, 0, 0.15)';
            else if (recipe === 'superia') ctx.fillStyle = 'rgba(0, 180, 120, 0.15)';
            else if (recipe === 'classic-neg') ctx.fillStyle = 'rgba(0, 150, 50, 0.1)';
            else if (recipe === 'kodachrome64') ctx.fillStyle = 'rgba(255, 50, 0, 0.1)';
            else if (recipe === 'portra400') ctx.fillStyle = 'rgba(255, 210, 140, 0.12)'; 
            else if (recipe === 'cinestill800t') ctx.fillStyle = 'rgba(0, 100, 200, 0.15)'; 
            else if (recipe === 'industrial100') ctx.fillStyle = 'rgba(0, 255, 150, 0.05)'; 
            else if (recipe === 'velvia') ctx.fillStyle = 'rgba(255, 50, 150, 0.05)'; 
            else if (recipe === 'punchy-chrome') ctx.fillStyle = 'rgba(255, 160, 100, 0.12)';
            else if (recipe === 'trix400') ctx.fillStyle = 'rgba(0, 0, 0, 0)'; 
            
            // IG Overlays
            else if (recipe === 'ig-90s') ctx.fillStyle = 'rgba(255, 150, 200, 0.15)'; // Magenta glow
            else if (recipe === 'ig-flash') ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
            else if (recipe === 'ig-filmgrade') ctx.fillStyle = 'rgba(0, 50, 100, 0.2)'; // Deep teal shadows
            else if (recipe === 'ig-cinematic') ctx.fillStyle = 'rgba(0, 100, 200, 0.15)'; // Orange/Teal
            else ctx.fillStyle = 'rgba(57, 255, 20, 0.05)'; 
            
            ctx.fillRect(padX, padYTop, vw, vh);
            ctx.globalCompositeOperation = 'source-over';

            // Light Leaks
            if (recipe !== 'trix400' && Math.random() > 0.7) {
                const leak = ctx.createLinearGradient(padX, padYTop, padX + (vw * 0.3), padYTop);
                const leakColor = recipe === 'cinestill800t' ? 'rgba(255, 20, 20, 0.5)' : 'rgba(255, 50, 0, 0.4)';
                leak.addColorStop(0, leakColor); leak.addColorStop(1, 'rgba(255, 50, 0, 0)');
                ctx.fillStyle = leak; ctx.globalCompositeOperation = 'screen'; ctx.fillRect(padX, padYTop, vw, vh); ctx.globalCompositeOperation = 'source-over';
            }

            // Analog Grain
            const grainRecipes = ['punchy-chrome', 'trix400', 'cinestill800t', 'portra400', 'superia', 'ig-filmgrade', 'ig-cinematic'];
            if (grainRecipes.includes(recipe)) {
                const imgData = ctx.getImageData(padX, padYTop, vw, vh);
                const noiseIntensity = (recipe === 'trix400' || recipe === 'cinestill800t') ? 50 : 25;
                for(let i=0; i < imgData.data.length; i+=4) {
                    let noise = (Math.random() - 0.5) * noiseIntensity;
                    imgData.data[i] = Math.min(255, Math.max(0, imgData.data[i] + noise));
                    imgData.data[i+1] = Math.min(255, Math.max(0, imgData.data[i+1] + noise));
                    imgData.data[i+2] = Math.min(255, Math.max(0, imgData.data[i+2] + noise));
                }
                ctx.putImageData(imgData, padX, padYTop);
            }

            // Date Stamp
            ctx.font = `bold ${vh * 0.04}px "Share Tech Mono", monospace`;
            ctx.fillStyle = recipe === 'trix400' ? '#ffffff' : '#ff7b00'; 
            ctx.textAlign = 'right';
            ctx.shadowColor = recipe === 'trix400' ? '#000000' : '#ff5e00'; 
            ctx.shadowBlur = 10; ctx.shadowOffsetX = 2; ctx.shadowOffsetY = 2;
            const dateOffset = isRoundOn ? (cornerRadius / 2) : 0;
            ctx.fillText(liveDate.innerText, padX + vw - (vw * 0.05) - dateOffset, padYTop + vh - (vh * 0.05) - dateOffset);
            ctx.shadowBlur = 0;
            ctx.restore(); 

            // Simpan Gambar
            const dataURL = canvas.toDataURL('image/jpeg', 0.9);
            galleryThumb.src = dataURL; galleryThumb.style.display = 'block';

            const itemDiv = document.createElement('div');
            itemDiv.className = 'gallery-item';
            const imgEl = document.createElement('img');
            imgEl.src = dataURL;
            itemDiv.appendChild(imgEl);
            
            itemDiv.addEventListener('click', (e) => handleGalleryItemClick(e, dataURL, itemDiv));
            galleryGrid.prepend(itemDiv);
        });
    </script>
</body>
</html>
