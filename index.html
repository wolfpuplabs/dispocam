<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Disposable Camera</title>
    <style>
        :root {
            --bg-color: #2c3e50;
            --cam-color: #f1c40f;
        }
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--bg-color);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        .camera-body {
            background-color: var(--cam-color);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .viewfinder-container {
            position: relative;
            width: 100%;
            border-radius: 10px;
            overflow: hidden;
            background-color: black;
            border: 4px solid #333;
            margin-bottom: 15px;
        }
        video {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }
        
        /* Filter Viewfinder Real-time */
        .filter-kodak-gold { filter: contrast(1.1) saturate(1.3) sepia(0.3) hue-rotate(-10deg); }
        .filter-superia-800 { filter: contrast(1.2) saturate(0.8) sepia(0.2) hue-rotate(15deg); }
        .filter-kodachrome { filter: contrast(1.4) saturate(1.2) sepia(0.1); }
        
        .controls { display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px; }
        select, button { padding: 10px; font-size: 16px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; }
        .shutter-btn { background-color: #e74c3c; color: white; font-size: 20px; padding: 15px; border: 3px solid #c0392b; border-radius: 50px; }
        .shutter-btn:active { transform: scale(0.95); background-color: #c0392b; }
        
        .gallery { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 20px; max-width: 600px; }
        .gallery img { width: 150px; height: auto; border: 5px solid white; box-shadow: 2px 2px 8px rgba(0,0,0,0.3); }
        canvas { display: none; }
    </style>
</head>
<body>

    <div class="camera-body">
        <h2 style="color: #333; margin-top: 0;">DISPOSABLE CAM</h2>
        <div class="viewfinder-container" id="viewfinder-container">
            <video id="video" autoplay playsinline></video>
        </div>
        <div class="controls">
            <select id="film-recipe">
                <option value="none">Normal</option>
                <option value="filter-kodak-gold">Kodak Gold 200</option>
                <option value="filter-superia-800">Fujicolor Superia 800</option>
                <option value="filter-kodachrome">McCurry Kodachrome</option>
            </select>
            <button class="shutter-btn" id="snap">📸 S N A P</button>
        </div>
    </div>

    <h3>Photo Gallery</h3>
    <div class="gallery" id="gallery"></div>
    <canvas id="canvas"></canvas>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const snapButton = document.getElementById('snap');
        const gallery = document.getElementById('gallery');
        const recipeSelect = document.getElementById('film-recipe');
        const viewfinderContainer = document.getElementById('viewfinder-container');
        const context = canvas.getContext('2d');

        // Akses kamera
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
            .then(stream => { video.srcObject = stream; })
            .catch(err => { alert("Mohon izinkan akses kamera."); });

        // Ganti filter viewfinder
        recipeSelect.addEventListener('change', (e) => {
            video.className = '';
            if (e.target.value !== 'none') video.classList.add(e.target.value);
        });

        // Proses pengambilan foto
        snapButton.addEventListener('click', () => {
            // Efek Flash
            viewfinderContainer.style.backgroundColor = 'white';
            video.style.opacity = '0.3';
            setTimeout(() => {
                viewfinderContainer.style.backgroundColor = 'black';
                video.style.opacity = '1';
            }, 100);

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const filterClass = recipeSelect.value;

            // 1. Terapkan Filter Dasar
            if (filterClass === 'filter-kodak-gold') {
                context.filter = 'contrast(1.1) saturate(1.3) brightness(1.05) sepia(0.3) hue-rotate(-10deg)';
            } else if (filterClass === 'filter-superia-800') {
                context.filter = 'contrast(1.2) saturate(0.8) brightness(0.95) sepia(0.2) hue-rotate(15deg)';
            } else if (filterClass === 'filter-kodachrome') {
                context.filter = 'contrast(1.4) saturate(1.2) brightness(0.95) sepia(0.1)';
            } else {
                context.filter = 'none';
            }

            // Gambar video ke canvas
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            context.filter = 'none'; // Reset filter agar tidak menumpuk ke overlay

            // Jika menggunakan filter, tambahkan Tinting, Vignette & Grain
            if (filterClass !== 'none') {
                
                // 2. Color Tinting (Mensimulasikan White Balance & Color Chrome)
                context.globalCompositeOperation = 'overlay';
                if (filterClass === 'filter-kodak-gold') {
                    context.fillStyle = 'rgba(255, 200, 0, 0.15)'; // Golden warm
                } else if (filterClass === 'filter-superia-800') {
                    context.fillStyle = 'rgba(0, 150, 100, 0.15)'; // Cyan/Greenish
                } else if (filterClass === 'filter-kodachrome') {
                    context.fillStyle = 'rgba(255, 50, 50, 0.12)'; // Punchy Red
                }
                context.fillRect(0, 0, canvas.width, canvas.height);
                context.globalCompositeOperation = 'source-over';

                // 3. Vignette (Bayangan gelap di sudut ala lensa kamera saku)
                const gradient = context.createRadialGradient(
                    canvas.width/2, canvas.height/2, canvas.width * 0.3,
                    canvas.width/2, canvas.height/2, canvas.width * 0.7
                );
                gradient.addColorStop(0, 'rgba(0,0,0,0)');
                gradient.addColorStop(1, 'rgba(0,0,0,0.5)');
                context.fillStyle = gradient;
                context.fillRect(0, 0, canvas.width, canvas.height);

                // 4. Efek Grain Manual
                const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
                const pixels = imageData.data;
                for (let i = 0; i < pixels.length; i += 4) {
                    const noise = (Math.random() - 0.5) * 35; // Intensitas noise
                    pixels[i] = Math.min(255, Math.max(0, pixels[i] + noise));
                    pixels[i+1] = Math.min(255, Math.max(0, pixels[i+1] + noise));
                    pixels[i+2] = Math.min(255, Math.max(0, pixels[i+2] + noise));
                }
                context.putImageData(imageData, 0, 0);
            }

            // Tampilkan ke galeri
            const img = document.createElement('img');
            img.src = canvas.toDataURL('image/jpeg', 0.85);
            gallery.prepend(img);
        });
    </script>
</body>
</html>
