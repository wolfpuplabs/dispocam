<style>
  :root {
    --bg: #0b0b0c; --surface: #161618; --surface-2: #1f1f22; --line: rgba(255,255,255,.08);
    --text: #f2f2f2; --muted: rgba(242,242,242,.5);
    --accent: #39FF14; --accent-ink: #0b0b0c;
    --paper: #f7f6f2;
    --vf-ratio: .75;
    --safe-t: env(safe-area-inset-top); --safe-b: env(safe-area-inset-bottom);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  .app { height: 100vh; height: 100dvh; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; padding-top: var(--safe-t); }

  /* ---------- Top bar ---------- */
  .top { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; padding: 12px 14px 8px; }
  .tgroup { display: flex; gap: 6px; }
  .tbtn { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--line); color: var(--muted); transition: background .2s, color .2s, border-color .2s; }
  .tbtn.lang { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 12px; letter-spacing: .5px; color: var(--text); }
  .tbtn.on { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .brand { text-align: center; min-width: 0; }
  .brand-name { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 17px; letter-spacing: 1.5px; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brand-sub { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin-top: 1px; padding: 0 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brand-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-right: 6px; vertical-align: 1px; }

  /* ---------- Viewfinder ---------- */
  .vf-wrap { flex: 1; min-height: 0; display: grid; place-items: center; padding: 6px 16px; container-type: size; }
  .vf { position: relative; width: min(100%, 420px); aspect-ratio: var(--vf-ratio); background: #000; border-radius: 18px; overflow: hidden; box-shadow: 0 0 0 1px var(--line), 0 24px 60px rgba(0,0,0,.7); transition: background .3s; container-type: size; touch-action: pan-y; }
  @supports (width: 1cqh) { .vf { width: min(100cqw, calc(100cqh * var(--vf-ratio))); } }
  .vf.framed { background: var(--paper); }
  .photo { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: hidden; container-type: size; background: #000; }
  .vf.framed .photo { left: 4.545%; width: 90.91%; top: 3.119%; height: 83.16%; box-shadow: 0 0 0 1px rgba(0,0,0,.12); }
  .vf.rounded .photo { border-radius: 5cqw; }
  .vf.framed.rounded { border-radius: 7cqw; }
  #preview { width: 100%; height: 100%; display: block; }
  #video { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  .stamp { position: absolute; right: 5cqw; bottom: 5cqh; font-family: 'VT323', monospace; font-size: 4.5cqh; letter-spacing: .1em; color: #ff7b00; text-shadow: 1px 1px 5px rgba(255,94,0,.8); pointer-events: none; line-height: 1; }
  .vf.rounded .stamp { right: 7.5cqw; bottom: 7cqh; }
  .vf.bw .stamp { color: #fff; text-shadow: 1px 1px 4px rgba(0,0,0,.8); }
  .vf.nodate .stamp { display: none; }
  .frame-label { position: absolute; left: 0; right: 0; bottom: 4.2%; text-align: center; font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 3.2cqw; color: #888; display: none; }
  .vf.framed .frame-label { display: block; }
  .blink { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 5; }
  .toast { position: absolute; top: 14px; left: 50%; transform: translate(-50%, -8px); background: rgba(0,0,0,.65); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); color: #fff; font-family: 'Oswald', sans-serif; letter-spacing: 2px; font-size: 13px; padding: 6px 14px; border-radius: 99px; opacity: 0; transition: .25s; pointer-events: none; z-index: 6; white-space: nowrap; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .vf-msg { position: absolute; inset: 0; display: none; flex-direction: column; gap: 14px; align-items: center; justify-content: center; text-align: center; padding: 24px; color: #ddd; font-size: 14px; line-height: 1.5; background: #000; z-index: 7; }
  .vf-msg.show { display: flex; }
  .pill { background: var(--accent); color: var(--accent-ink); font-weight: 700; padding: 10px 18px; border-radius: 99px; font-size: 14px; }

  /* ---------- Film strip ---------- */
  .strip-wrap { position: relative; padding: 10px 0 4px; -webkit-mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent); mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent); }
  .strip { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 4px calc(50% - 32px) 6px; scrollbar-width: none; }
  .strip::-webkit-scrollbar { display: none; }
  .film { flex: 0 0 64px; scroll-snap-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; opacity: .55; transition: opacity .2s; }
  .film.on { opacity: 1; }
  .can { width: 56px; height: 56px; border-radius: 14px; display: grid; place-items: center; font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: .5px; position: relative; overflow: hidden; transition: transform .2s, box-shadow .2s; box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); }
  .can::after { content: ""; position: absolute; inset: 0; background: linear-gradient(160deg, rgba(255,255,255,.28), transparent 45%, rgba(0,0,0,.25)); }
  .film.on .can { transform: scale(1.06); box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent); }
  .film-name { font-size: 9.5px; font-weight: 600; letter-spacing: .4px; text-transform: uppercase; color: var(--muted); white-space: nowrap; max-width: 72px; overflow: hidden; text-overflow: ellipsis; }
  .film.on .film-name { color: var(--text); }

  /* ---------- Controls ---------- */
  .controls { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 10px 28px calc(18px + var(--safe-b)); }
  .thumb { justify-self: start; width: 52px; height: 52px; border-radius: 12px; overflow: hidden; background: var(--surface); border: 1px solid var(--line); position: relative; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: none; }
  .thumb .count { position: absolute; top: -6px; right: -6px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); font-size: 11px; font-weight: 700; display: none; place-items: center; }
  .shutter { width: 80px; height: 80px; border-radius: 50%; border: 4px solid var(--text); display: grid; place-items: center; }
  .shutter span { width: 62px; height: 62px; border-radius: 50%; background: var(--text); transition: transform .12s, background .2s; box-shadow: inset 0 -4px 0 rgba(0,0,0,.12); }
  .shutter:active span, .shutter.busy span { transform: scale(.86); background: var(--accent); }
  .flip { justify-self: end; width: 52px; height: 52px; border-radius: 50%; background: var(--surface); border: 1px solid var(--line); display: grid; place-items: center; transition: transform .4s; }
  .flip.spin { transform: rotate(180deg); }
  .flip svg.i { width: 22px; height: 22px; }

  /* ---------- Overlays ---------- */
  .sheet { position: fixed; inset: 0; background: var(--bg); z-index: 50; display: flex; flex-direction: column; padding-top: var(--safe-t); transform: translateY(100%); transition: transform .32s cubic-bezier(.2,.8,.2,1); visibility: hidden; }
  .sheet.open { transform: none; visibility: visible; }
  .sheet-head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .sheet-head > :first-child { justify-self: start; } .sheet-head > :last-child { justify-self: end; }
  .sheet-title { font-family: 'Oswald', sans-serif; letter-spacing: 3px; font-size: 15px; text-transform: uppercase; }
  .sheet-title small { display: block; text-align: center; font-family: 'Inter'; letter-spacing: 1px; font-size: 10px; color: var(--muted); }
  .txt { font-size: 15px; font-weight: 600; padding: 6px 4px; }
  .txt.accent { color: var(--accent); }
  .ibtn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; }
  .ibtn:active { background: var(--surface-2); }

  .grid { flex: 1; overflow-y: auto; padding: 3px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; align-content: start; }
  .cell { position: relative; aspect-ratio: 3/4; background: var(--surface); overflow: hidden; }
  .cell img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .2s, opacity .2s; }
  .cell .chk { position: absolute; right: 6px; bottom: 6px; width: 22px; height: 22px; border-radius: 50%; border: 2px solid #fff; background: rgba(0,0,0,.3); display: none; place-items: center; }
  .selecting .cell .chk { display: grid; }
  .cell.sel img { transform: scale(.9); opacity: .75; }
  .cell.sel .chk { background: var(--accent); border-color: var(--accent); }
  .cell.sel .chk::after { content: ""; width: 9px; height: 5px; border: solid var(--accent-ink); border-width: 0 0 2px 2px; transform: translateY(-1px) rotate(-45deg); }
  .empty { grid-column: 1/-1; text-align: center; color: var(--muted); padding: 80px 20px; font-size: 14px; line-height: 1.6; }

  .bar { display: none; gap: 10px; padding: 12px 16px calc(12px + var(--safe-b)); border-top: 1px solid var(--line); background: var(--surface); }
  .bar.show { display: flex; }
  .bar button { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px; border-radius: 12px; font-weight: 600; font-size: 14px; background: var(--surface-2); }
  .bar button.primary { background: var(--accent); color: var(--accent-ink); }
  .bar button.danger { color: #ff5a5a; flex: 0 0 auto; padding: 12px 16px; }
  .bar button:disabled { opacity: .4; }

  .viewer { flex: 1; min-height: 0; display: grid; place-items: center; padding: 16px; background: #000; touch-action: pan-y; }
  .viewer img { max-width: 100%; max-height: 100%; object-fit: contain; -webkit-touch-callout: default; -webkit-user-select: auto; user-select: auto; }

  canvas.hidden { display: none; }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="tgroup">
      <button class="tbtn" id="flash-btn" data-i18n-aria="flash" aria-label="Flash"><svg class="i" viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg></button>
      <button class="tbtn" id="date-btn" data-i18n-aria="dateStamp" aria-label="Date stamp"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></button>
    </div>
    <div class="brand">
      <div class="brand-name" id="brand-name">DISPO</div>
      <div class="brand-sub"><span class="brand-dot"></span><span id="brand-sub">Disposable</span></div>
    </div>
    <div class="tgroup">
      <button class="tbtn" id="frame-btn" data-i18n-aria="paperFrame" aria-label="Paper frame"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="1"/><rect x="7" y="6" width="10" height="9"/></svg></button>
      <button class="tbtn" id="round-btn" data-i18n-aria="rounded" aria-label="Rounded corners"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="5"/></svg></button>
      <button class="tbtn lang" id="lang-btn" data-i18n-aria="language" aria-label="Language">EN</button>
    </div>
  </header>

  <div class="vf-wrap">
    <div class="vf" id="vf">
      <div class="photo">
        <canvas id="preview"></canvas>
        <div class="stamp" id="stamp"></div>
      </div>
      <div class="frame-label" id="frame-label"></div>
      <video id="video" autoplay playsinline muted></video>
      <div class="toast" id="toast"></div>
      <div class="blink" id="blink"></div>
      <div class="vf-msg" id="vf-msg">
        <div id="vf-msg-text">Allow camera access to start shooting.</div>
        <button class="pill" id="retry-btn" data-i18n="tryAgain">Try again</button>
      </div>
    </div>
  </div>

  <div class="strip-wrap"><div class="strip" id="strip"></div></div>

  <div class="controls">
    <button class="thumb" id="thumb" data-i18n-aria="library" aria-label="Library"><img id="thumb-img" alt=""><span class="count" id="thumb-count"></span></button>
    <button class="shutter" id="shutter" data-i18n-aria="takePhoto" aria-label="Take photo"><span></span></button>
    <button class="flip" id="flip-btn" data-i18n-aria="switchCamera" aria-label="Switch camera"><svg class="i" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8"/><path d="M4 3v5h5"/><path d="M4 13a8 8 0 0 0 14.3 4.9L20 16"/><path d="M20 21v-5h-5"/></svg></button>
  </div>
</div>

<!-- Library -->
<section class="sheet" id="library">
  <div class="sheet-head">
    <button class="ibtn" id="lib-close" data-i18n-aria="close" aria-label="Close"><svg class="i" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
    <div class="sheet-title"><span data-i18n="library">Library</span><small id="lib-count">0 photos</small></div>
    <button class="txt accent" id="select-btn">Select</button>
  </div>
  <div class="grid" id="grid"></div>
  <div class="bar" id="lib-bar">
    <button class="danger" id="multi-del" data-i18n-aria="delete" aria-label="Delete"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
    <button class="primary" id="multi-share"><svg class="i" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg><span data-i18n="saveShare">Save / Share</span> (<span id="sel-count">0</span>)</button>
  </div>
</section>

<!-- Viewer -->
<section class="sheet" id="viewer">
  <div class="sheet-head">
    <button class="ibtn" id="view-close" data-i18n-aria="back" aria-label="Back"><svg class="i" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg></button>
    <div class="sheet-title" id="view-title">Photo<small id="view-sub"></small></div>
    <span></span>
  </div>
  <div class="viewer" id="view-stage"><img id="view-img" alt="Photo"></div>
  <div class="bar show">
    <button class="danger" id="view-del" data-i18n-aria="delete" aria-label="Delete"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
    <button id="view-save"><svg class="i" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg><span data-i18n="save">Save</span></button>
    <button class="primary" id="view-share"><svg class="i" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg><span data-i18n="share">Share</span></button>
  </div>
</section>

<script>
(() => {
'use strict';

/* =====================================================================

  { id:'dispo', name:'Dispo Green', short:'DISPO', cat:'Disposable', accent:'#39FF14', label:'DISPO 35MM',

  { id:'industrial100', name:'Industrial 100', short:'100', cat:'Fujicolor · ISO 100', accent:'#2E86AB', label:'FUJICOLOR INDUSTRIAL',
    contrast:1.1, sat:1.15, wb:[.98,1.03,.98], shadow:[-.01,.02,.01], high:[0,.01,0], vignette:.3, grain:.05 },

/* =====================================================================
   WEBGL FILM RENDERER
   ===================================================================== */
const VS = `attribute vec2 p; varying vec2 v;
void main(){ v = vec2(p.x*.5+.5, .5-p.y*.5); gl_Position = vec4(p,0.,1.); }`;

const FS = `
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
varying vec2 v;
uniform sampler2D uTex;
uniform vec2 uCropOff, uCropScale, uRes;
uniform float uMirror, uExposure, uContrast, uSat, uBW, uVignette, uGrain, uGrainSize, uBloom, uHal, uFlash, uSeed;
uniform vec3 uWB, uMix, uBlack, uWhite, uShadow, uHigh, uHalColor;

vec2 toTex(vec2 q){ q.x = mix(q.x, 1.-q.x, uMirror); return uCropOff + clamp(q,0.,1.)*uCropScale; }
float luma(vec3 c){ return dot(c, vec3(.2126,.7152,.0722)); }
float hash(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*.1031); p3 += dot(p3, p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p); f = f*f*(3.-2.*f);
  return mix(mix(hash(i), hash(i+vec2(1,0)), f.x), mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), f.x), f.y);
}
// Smooth, continuous S-curve (no hard thresholds -> no posterisation)
vec3 curve(vec3 x, float k){
  vec3 lo = .5*pow(2.*x, vec3(k));
  vec3 hi = 1.-.5*pow(2.*(1.-x), vec3(k));
  return mix(lo, hi, step(.5, x));
}
vec3 blur(vec2 q){
  vec3 s = vec3(0.);
  vec2 asp = vec2(1., uRes.x/uRes.y);
  for (int i = 0; i < 16; i++) {
    float fi = float(i);
    float a = fi*2.39996;
    float r = sqrt((fi+.5)/16.)*.03;
    s += texture2D(uTex, toTex(q + vec2(cos(a), sin(a))*r*asp)).rgb;
  }
  return s/16.;
}
void main(){
  vec2 q = v;
  vec3 c = texture2D(uTex, toTex(q)).rgb;
  float ar = uRes.x/uRes.y;
  float d = length((q-.5)*vec2(ar,1.)) / length(vec2(ar,1.)*.5); // 0 centre .. 1 corner

  float ev = uExposure + uFlash*(.55*(1.-smoothstep(0.,.8,d)) - .25);
  vec3 gain = exp2(ev)*uWB;
  c *= gain;

  if (uBloom > 0. || uHal > 0.) {
    vec3 b = clamp(blur(q)*gain, 0., 1.);
    c = 1. - (1.-clamp(c,0.,1.))*(1. - b*uBloom);
    c += uHalColor * smoothstep(.55, .95, luma(b)) * uHal;
  }
  c = clamp(c, 0., 1.);

  float l = luma(c);
  c = clamp(mix(vec3(l), c, uSat), 0., 1.);
  if (uBW > .5) c = vec3(clamp(dot(c, uMix), 0., 1.));

  c = curve(c, uContrast + uFlash*.2);
  c = mix(uBlack, uWhite, c);

  l = luma(c);
  c += uShadow*(1.-smoothstep(0.,.55,l)) + uHigh*smoothstep(.45,1.,l);

  c *= 1. - (uVignette + uFlash*.2)*smoothstep(.35, 1.1, d);

  if (uGrain > 0.) {
    vec2 gp = gl_FragCoord.xy/uGrainSize + uSeed;
    float n = (vnoise(gp) + vnoise(gp*1.93 + 17.3) - 1.);       // luminance grain, ~[-1,1]
    l = luma(c);
    float w = 1. - .65*pow(abs(l-.5)*2., 2.);                  // strongest in mid-tones
    vec3 g = vec3(n);
    if (uBW < .5) g += .25*vec3(vnoise(gp+41.7)-.5, vnoise(gp+7.1)-.5, vnoise(gp+93.3)-.5);
    c += g*uGrain*w;
  }
  gl_FragColor = vec4(clamp(c, 0., 1.), 1.);
}`;

const UNIFORMS = ['uTex','uCropOff','uCropScale','uRes','uMirror','uExposure','uContrast','uSat','uBW','uVignette','uGrain','uGrainSize','uBloom','uHal','uFlash','uSeed','uWB','uMix','uBlack','uWhite','uShadow','uHigh','uHalColor'];

class FilmRenderer {
  constructor(canvas, preserve) {
    const opts = { alpha: false, antialias: false, premultipliedAlpha: false, preserveDrawingBuffer: !!preserve };
    const gl = canvas.getContext('webgl', opts) || canvas.getContext('experimental-webgl', opts);
    if (!gl) throw new Error('WebGL unavailable');
    this.gl = gl; this.canvas = canvas;
    const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
    const prog = gl.createProgram();
    gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
    gl.useProgram(prog);
    const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(prog, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    this.u = {}; UNIFORMS.forEach(n => this.u[n] = gl.getUniformLocation(prog, n));

    [[gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE], [gl.TEXTURE_MIN_FILTER, gl.LINEAR], [gl.TEXTURE_MAG_FILTER, gl.LINEAR]]
      .forEach(([k, val]) => gl.texParameteri(gl.TEXTURE_2D, k, val));
    gl.uniform1i(this.u.uTex, 0);
  }
  render(source, o) {
    const { gl, u } = this, f = o.film;
    if (this.canvas.width !== o.width || this.canvas.height !== o.height) { this.canvas.width = o.width; this.canvas.height = o.height; }
    gl.viewport(0, 0, o.width, o.height);
    gl.bindTexture(gl.TEXTURE_2D, this.tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, source);
    gl.uniform2f(u.uCropOff, o.crop.x, o.crop.y); gl.uniform2f(u.uCropScale, o.crop.w, o.crop.h);
    gl.uniform2f(u.uRes, o.width, o.height);
    gl.uniform1f(u.uMirror, o.mirror ? 1 : 0);
    gl.uniform1f(u.uExposure, f.exposure); gl.uniform1f(u.uContrast, f.contrast); gl.uniform1f(u.uSat, f.sat);
    gl.uniform1f(u.uBW, f.bw); gl.uniform1f(u.uVignette, f.vignette); gl.uniform1f(u.uGrain, f.grain);
    gl.uniform1f(u.uGrainSize, Math.max(1, o.width / 900) * f.grainSize);
    gl.uniform1f(u.uBloom, f.bloom); gl.uniform1f(u.uHal, f.hal);
    gl.uniform1f(u.uFlash, Math.max(f.flash, o.flash ? .7 : 0)); gl.uniform1f(u.uSeed, o.seed);
    gl.uniform3fv(u.uWB, f.wb); gl.uniform3fv(u.uMix, f.mix); gl.uniform3fv(u.uBlack, f.black); gl.uniform3fv(u.uWhite, f.white);
    gl.uniform3fv(u.uShadow, f.shadow); gl.uniform3fv(u.uHigh, f.high); gl.uniform3fv(u.uHalColor, f.halColor);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }
}

const store = {
  db: null,
  open() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      const r = indexedDB.open('dispocam', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('photos', { keyPath: 'id' });
      r.onsuccess = () => res(this.db = r.result);
      r.onerror = () => rej(r.error);
    });
  },
  async run(mode, fn) {
    try {
      const db = await this.open();
      return await new Promise((res, rej) => {
        const t = db.transaction('photos', mode); const req = fn(t.objectStore('photos'));
        t.oncomplete = () => res(req && req.result); t.onerror = () => rej(t.error);
      });
    } catch (e) { console.warn('storage', e); return null; }
  },
  all() { return this.run('readonly', s => s.getAll()); },
  put(p) { return this.run('readwrite', s => s.put(p)); },
  del(id) { return this.run('readwrite', s => s.delete(id)); },
};

let paperPattern = null;
function getPaperPattern(ctx) {
  if (paperPattern) return paperPattern;
  const c = document.createElement('canvas'); c.width = c.height = 256; const x = c.getContext('2d');
  const img = x.createImageData(256, 256);
  for (let i = 0; i < img.data.length; i += 4) { const n = 236 + Math.random() * 14; img.data[i] = n + 4; img.data[i+1] = n + 3; img.data[i+2] = n; img.data[i+3] = 255; }
  x.putImageData(img, 0, 0);

}

  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();

async function capture() {
  if (busy || !video.videoWidth || !previewR) return;
  busy = true; $('shutter').classList.add('busy'); vibrate(15);
  const blink = $('blink'); const isFront = prefs.facing === 'user';
  const useFlash = prefs.flash || film.flash > 0;
  const track = stream && stream.getVideoTracks()[0];

  try {
    // Real light where possible: torch on rear camera, white screen on front camera
    if (useFlash && isFront) { blink.style.transition = 'none'; blink.style.opacity = '1'; await wait(220); }
    else if (useFlash && torchOK && track) { await track.applyConstraints({ advanced: [{ torch: true }] }).catch(() => {}); await wait(450); }

    const crop = cropFor(video.videoWidth, video.videoHeight);
    const w = Math.round(Math.min(1440, Math.max(900, video.videoWidth * crop.w))), h = Math.round(w * 4/3);
    if (!captureR) captureR = new FilmRenderer(document.createElement('canvas'), true);
    captureR.render(video, { width: w, height: h, film, crop, mirror: isFront, flash: prefs.flash, seed: Math.random() * 100 });

    if (useFlash && torchOK && track && !isFront) track.applyConstraints({ advanced: [{ torch: false }] }).catch(() => {});
    blink.style.transition = 'none'; blink.style.opacity = '1';
    requestAnimationFrame(() => { blink.style.transition = 'opacity .55s ease-out'; blink.style.opacity = '0'; });

    await fontsReady;
    const blob = await compose(captureR.canvas, w, h, film);
    await addPhoto(blob, film);
  } catch (e) {
    console.error(e); toast(t('saveFailed'));
  } finally {
    busy = false; $('shutter').classList.remove('busy');
  }
}

  const frame = prefs.frame, round = prefs.round;
  const padX = frame ? Math.round(w * .05) : 0, padTop = padX, padBot = frame ? Math.round(w * .22) : 0;
  const out = document.createElement('canvas'); out.width = w + padX * 2; out.height = h + padTop + padBot;
  const ctx = out.getContext('2d'); const W = out.width, H = out.height;
  const r = round ? w * .05 : 0;

  // paper (also fills behind rounded corners when there is no frame)
  ctx.fillStyle = '#f7f6f2'; ctx.fillRect(0, 0, W, H);
  if (frame) { ctx.globalAlpha = .55; ctx.fillStyle = getPaperPattern(ctx); ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }

  ctx.save();
  if (round) roundRect(ctx, padX, padTop, w, h, r); else { ctx.beginPath(); ctx.rect(padX, padTop, w, h); }
  ctx.clip();
  ctx.drawImage(src, padX, padTop, w, h);

  // occasional light leak on disposable-style stocks
  if (f.leak && Math.random() < .25) {
    const fromLeft = Math.random() < .5;
    const g = ctx.createLinearGradient(fromLeft ? padX : padX + w, 0, fromLeft ? padX + w * .4 : padX + w * .6, 0);
    g.addColorStop(0, 'rgba(255,70,10,.45)'); g.addColorStop(.5, 'rgba(255,140,40,.15)'); g.addColorStop(1, 'rgba(255,140,40,0)');
    ctx.globalCompositeOperation = 'screen'; ctx.fillStyle = g; ctx.fillRect(padX, padTop, w, h); ctx.globalCompositeOperation = 'source-over';
  }

  if (prefs.date) {
    const bw = !!f.bw, off = round ? r * .5 : 0;
    ctx.font = `${Math.round(h * .045)}px "VT323", monospace`; ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = bw ? '#ffffff' : '#ff7b00';
    ctx.shadowColor = bw ? 'rgba(0,0,0,.8)' : 'rgba(255,94,0,.8)'; ctx.shadowBlur = h * .006; ctx.shadowOffsetX = ctx.shadowOffsetY = h * .0015;
    ctx.letterSpacing = '0.1em';
    ctx.fillText(fmtDate(), padX + w - w * .05 - off, padTop + h - h * .05 - off);
  }
  ctx.restore();

  if (frame) {
    ctx.strokeStyle = 'rgba(0,0,0,.12)'; ctx.lineWidth = Math.max(1, w * .002);
    if (round) { roundRect(ctx, padX, padTop, w, h, r); ctx.stroke(); } else ctx.strokeRect(padX, padTop, w, h);
    ctx.fillStyle = '#888'; ctx.font = `700 ${Math.round(W * .035)}px 'Oswald', sans-serif`; ctx.textAlign = 'center';
    ctx.fillText(f.label, W / 2, H - padBot / 2.5);
  }
  return new Promise(res => out.toBlob(res, 'image/jpeg', .92));
}

/* =====================================================================
   LIBRARY
   ===================================================================== */
const grid = $('grid');
let selecting = false; const selected = new Set(); let viewIdx = 0;

async function addPhoto(blob, f) {
  const p = { id: Date.now() + '-' + Math.random().toString(36).slice(2, 7), blob, film: f.name, created: Date.now() };
  p.url = URL.createObjectURL(blob);
  photos.unshift(p); store.put({ id: p.id, blob, film: p.film, created: p.created });
  renderThumb(); renderGrid();
}
function renderThumb() {
  const img = $('thumb-img'), c = $('thumb-count');
  if (photos[0]) { img.src = photos[0].url; img.style.display = 'block'; c.textContent = photos.length; c.style.display = 'grid'; }
  else { img.style.display = 'none'; c.style.display = 'none'; }
}
function renderGrid() {
  grid.innerHTML = '';
  $('lib-count').textContent = t('photos', photos.length);
  if (!photos.length) { grid.innerHTML = `<div class="empty">${t('empty')}</div>`; return; }
  photos.forEach((p, i) => {
    const cell = document.createElement('div'); cell.className = 'cell' + (selected.has(p.id) ? ' sel' : '');
    cell.innerHTML = `<img src="${p.url}" alt="" loading="lazy"><span class="chk"></span>`;
    cell.addEventListener('click', () => {
      if (selecting) { selected.has(p.id) ? selected.delete(p.id) : selected.add(p.id); cell.classList.toggle('sel'); updateBar(); }
      else openViewer(i);
    });
    grid.appendChild(cell);
  });
}
function updateBar() {
  $('sel-count').textContent = selected.size;
  $('lib-bar').classList.toggle('show', selecting);
  $('multi-share').disabled = $('multi-del').disabled = !selected.size;
}
function setSelecting(on) {
  selecting = on; selected.clear(); $('select-btn').textContent = t(on ? 'cancel' : 'select');
  grid.classList.toggle('selecting', on); grid.querySelectorAll('.cell').forEach(c => c.classList.remove('sel')); updateBar();
}
$('select-btn').addEventListener('click', () => setSelecting(!selecting));
$('thumb').addEventListener('click', () => { renderGrid(); $('library').classList.add('open'); });
$('lib-close').addEventListener('click', () => { $('library').classList.remove('open'); setSelecting(false); });

const fileOf = p => new File([p.blob], `dispo_${p.created}.jpg`, { type: 'image/jpeg' });
function download(p) { const a = document.createElement('a'); a.href = p.url; a.download = `dispo_${p.created}.jpg`; document.body.appendChild(a); a.click(); a.remove(); }
async function shareOrSave(list) {
  const files = list.map(fileOf);
  if (navigator.canShare && navigator.canShare({ files })) {
    try { await navigator.share({ files }); return true; } catch (e) { return e.name !== 'AbortError' ? (list.forEach(download), true) : false; }
  }
  list.forEach((p, i) => setTimeout(() => download(p), i * 300)); return true;
}
async function deletePhotos(ids) {
  ids.forEach(id => { const p = photos.find(x => x.id === id); if (p) URL.revokeObjectURL(p.url); store.del(id); });
  photos = photos.filter(p => !ids.includes(p.id)); renderThumb(); renderGrid();
}
$('multi-share').addEventListener('click', async () => {
  if (!selected.size) return;
  if (await shareOrSave(photos.filter(p => selected.has(p.id)))) setSelecting(false);
});
$('multi-del').addEventListener('click', async () => {
  if (!selected.size || !confirm(t('confirmDeleteMany', selected.size))) return;
  await deletePhotos([...selected]); setSelecting(false);
});

/* ---------- Viewer ---------- */
function openViewer(i) { viewIdx = i; showViewer(); $('viewer').classList.add('open'); }
function showViewer() {
  const p = photos[viewIdx]; if (!p) { $('viewer').classList.remove('open'); return; }
  $('view-img').src = p.url;
  const d = new Date(p.created);
  $('view-title').firstChild.textContent = p.film;
  $('view-sub').textContent = `${viewIdx + 1}/${photos.length} · ${d.toLocaleDateString(t('locale'), { day: 'numeric', month: 'short', year: 'numeric' })} ${d.toLocaleTimeString(t('locale'), { hour: '2-digit', minute: '2-digit' })}`;
}
function stepViewer(dir) { const n = viewIdx + dir; if (n >= 0 && n < photos.length) { viewIdx = n; showViewer(); } }
$('view-close').addEventListener('click', () => $('viewer').classList.remove('open'));
$('view-share').addEventListener('click', () => photos[viewIdx] && shareOrSave([photos[viewIdx]]));
$('view-save').addEventListener('click', () => photos[viewIdx] && download(photos[viewIdx]));
$('view-del').addEventListener('click', async () => {
  const p = photos[viewIdx]; if (!p || !confirm(t('confirmDeleteOne'))) return;
  await deletePhotos([p.id]);
  if (!photos.length) { $('viewer').classList.remove('open'); return; }
  viewIdx = Math.min(viewIdx, photos.length - 1); showViewer();
});
(() => {
  let x0 = null; const st = $('view-stage');
  st.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
  st.addEventListener('touchend', e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null; if (Math.abs(dx) > 50) stepViewer(dx < 0 ? 1 : -1); });
})();
function closeTop() {
  if ($('viewer').classList.contains('open')) $('viewer').classList.remove('open');
  else { $('library').classList.remove('open'); setSelecting(false); }
}

/* =====================================================================
   BOOT
   ===================================================================== */
document.querySelectorAll('button').forEach(b => b.addEventListener('contextmenu', e => e.preventDefault()));
const tickDate = () => { $('stamp').textContent = fmtDate(); };
tickDate(); setInterval(tickDate, 60000);
function applyLang() {
  document.documentElement.lang = prefs.lang;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-aria]').forEach(el => el.setAttribute('aria-label', t(el.dataset.i18nAria)));
  $('lang-btn').textContent = prefs.lang.toUpperCase();
  $('select-btn').textContent = t(selecting ? 'cancel' : 'select');
  $('vf-msg-text').textContent = t(msgKey);
  renderGrid();
  if ($('viewer').classList.contains('open')) showViewer();
}
$('lang-btn').addEventListener('click', () => {
  prefs.lang = prefs.lang === 'en' ? 'id' : 'en'; savePrefs(); applyLang();
  toast(prefs.lang === 'en' ? 'ENGLISH' : 'BAHASA INDONESIA'); vibrate(6);
});
applyLang();
applyToggles();
setFilm(film, false);
requestAnimationFrame(() => { const el = strip.querySelector(`[data-id="${film.id}"]`); if (el) strip.scrollLeft = el.offsetLeft - strip.clientWidth / 2 + el.clientWidth / 2; });
store.all().then(list => {
  if (!list) return;
  photos = list.sort((a, b) => b.created - a.created).map(p => Object.assign(p, { url: URL.createObjectURL(p.blob) }));
  renderThumb();
});
initCamera();
document.addEventListener('visibilitychange', () => { if (!document.hidden && (!stream || stream.getVideoTracks().every(t => t.readyState === 'ended'))) initCamera(); });
})();
</script>
