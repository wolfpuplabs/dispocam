<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Disposable Camera</title>
    <style>
        :root {
            --bg-color: #2c3e50;
            --cam-color: #f1c40f; /* Warna kuning khas kamera sekali pakai Kodak */
        }
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--bg-color);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        .camera-body {
            background-color: var(--cam-color);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
            position: relative;
        }
        .viewfinder-container {
            position: relative;
            width: 100%;
            border-radius: 10px;
            overflow: hidden;
            background-color: black;
            border: 4px solid #333;
            margin-bottom: 15px;
        }
        video {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }
        /* Efek Grain untuk tampilan film analog */
        .film-grain::after {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.15'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 2;
        }
        /* Filter Resep Film */
        .filter-kodak-gold {
            filter: sepia(0.3) contrast(1.15) brightness(1.05) saturate(1.2) hue-rotate(-5deg);
        }
        .filter-superia-800 {
            filter: contrast(1.2) saturate(0.9) hue-rotate(-10deg) brightness(0.95);
        }
        .filter-kodachrome {
            filter: contrast(1.3) saturate(1.4) sepia(0.1) brightness(0.9);
        }
        
        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }
        select, button {
            padding: 10px;
            font-size: 16px;
            font-family: inherit;
            border-radius: 8px;
            border: none;
            cursor: pointer;
        }
        select {
            background-color: #fff;
            color: #333;
            font-weight: bold;
        }
        .shutter-btn {
            background-color: #e74c3c;
            color: white;
            font-weight: bold;
            font-size: 20px;
            padding: 15px;
            border: 3px solid #c0392b;
            border-radius: 50px;
            transition: transform 0.1s;
        }
        .shutter-btn:active {
            transform: scale(0.95);
            background-color: #c0392b;
        }
        .gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
            width: 100%;
            max-width: 600px;
        }
        .gallery img {
            width: 150px;
            height: auto;
            border: 5px solid white;
            border-radius: 2px;
            box-shadow: 2px 2px 8px rgba(0,0,0,0.3);
            background-color: white;
            position: relative;
        }
        canvas {
            display: none;
        }
    </style>
</head>
<body>

    <div class="camera-body">
        <h2 style="color: #333; margin-top: 0;">DISPOSABLE CAM</h2>
        
        <div class="viewfinder-container film-grain" id="viewfinder-container">
            <video id="video" autoplay playsinline></video>
        </div>

        <div class="controls">
            <select id="film-recipe">
                <option value="none">Normal (Tanpa Filter)</option>
                <option value="filter-kodak-gold">Kodak Gold 200</option>
                <option value="filter-superia-800">Fujicolor Superia 800</option>
                <option value="filter-kodachrome">McCurry Kodachrome</option>
            </select>
            
            <button class="shutter-btn" id="snap">📸 J E P R E T</button>
        </div>
    </div>

    <h3>Galeri Foto</h3>
    <div class="gallery" id="gallery"></div>
    <canvas id="canvas"></canvas>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const snapButton = document.getElementById('snap');
        const gallery = document.getElementById('gallery');
        const recipeSelect = document.getElementById('film-recipe');
        const viewfinderContainer = document.getElementById('viewfinder-container');
        const context = canvas.getContext('2d');

        // Meminta akses kamera
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
            .then(stream => {
                video.srcObject = stream;
            })
            .catch(err => {
                console.error("Gagal mengakses kamera: ", err);
                alert("Mohon izinkan akses kamera untuk menggunakan aplikasi ini.");
            });

        // Ganti filter di viewfinder secara real-time
        recipeSelect.addEventListener('change', (e) => {
            // Hapus semua class filter sebelumnya
            video.className = '';
            // Tambahkan class filter yang baru jika bukan 'none'
            if (e.target.value !== 'none') {
                video.classList.add(e.target.value);
            }
        });

        // Mengambil foto
        snapButton.addEventListener('click', () => {
            // Efek flash sederhana
            viewfinderContainer.style.backgroundColor = 'white';
            video.style.opacity = '0.3';
            setTimeout(() => {
                viewfinderContainer.style.backgroundColor = 'black';
                video.style.opacity = '1';
            }, 100);

            // Set ukuran canvas sesuai dengan video
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            // Terapkan filter CSS ke canvas context agar gambar yang disimpan memiliki filter
            const filterClass = recipeSelect.value;
            if (filterClass === 'filter-kodak-gold') {
                context.filter = 'sepia(0.3) contrast(1.15) brightness(1.05) saturate(1.2) hue-rotate(-5deg)';
            } else if (filterClass === 'filter-superia-800') {
                context.filter = 'contrast(1.2) saturate(0.9) hue-rotate(-10deg) brightness(0.95)';
            } else if (filterClass === 'filter-kodachrome') {
                context.filter = 'contrast(1.3) saturate(1.4) sepia(0.1) brightness(0.9)';
            } else {
                context.filter = 'none';
            }

            // Gambar frame video ke canvas
            context.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Tambahkan efek grain manual ke canvas dengan menggambar piksel acak
            if (filterClass !== 'none') {
                addCanvasGrain(context, canvas.width, canvas.height);
            }

            // Konversi canvas ke URL gambar
            const dataURL = canvas.toDataURL('image/jpeg', 0.8);
            
            // Buat elemen gambar dan masukkan ke galeri
            const img = document.createElement('img');
            img.src = dataURL;
            // Jika ada filter, beri kelas film-grain palsu via CSS untuk galeri
            if(filterClass !== 'none') {
                const wrapper = document.createElement('div');
                wrapper.classList.add('film-grain');
                wrapper.style.position = 'relative';
                wrapper.style.display = 'inline-block';
                wrapper.appendChild(img);
                gallery.prepend(wrapper);
            } else {
                gallery.prepend(img);
            }
        });

        // Fungsi untuk menambahkan efek bintik (grain) langsung ke dalam data gambar canvas
        function addCanvasGrain(ctx, w, h) {
            const imageData = ctx.getImageData(0, 0, w, h);
            const pixels = imageData.data;
            for (let i = 0; i < pixels.length; i += 4) {
                // Buat nilai noise acak
                const noise = (Math.random() - 0.5) * 30; // Intensitas grain
                pixels[i] = Math.min(255, Math.max(0, pixels[i] + noise));     // Red
                pixels[i+1] = Math.min(255, Math.max(0, pixels[i+1] + noise)); // Green
                pixels[i+2] = Math.min(255, Math.max(0, pixels[i+2] + noise)); // Blue
            }
            ctx.putImageData(imageData, 0, 0);
        }
    </script>
</body>
</html>
